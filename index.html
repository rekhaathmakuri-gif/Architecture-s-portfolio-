<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Student Management System</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><h1>Student<br>Management<br>System</h1><form id="studentForm"><input type="hidden" id="studentId"><label>Name</label><input id="name" required><label>Age</label><input id="age" type="number" min="1" max="120" required><label>Course</label><input id="course" required><button type="submit">Save Student</button><button type="button" id="cancelBtn" class="cancel">Cancel</button></form><p id="message"></p><h2>Students</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Age</th><th>Course</th><th>Actions</th></tr></thead><tbody id="studentTable"></tbody></table></div></div><script src="script.js"></script></body></html>
